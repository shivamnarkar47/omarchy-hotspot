[keyfile]
# Template for the installer-managed file
# /etc/NetworkManager/conf.d/zz-omarchy-hotspot-unmanaged.conf.
# The zz- prefix sorts last in conf.d so it wins over other plugins that also
# set unmanaged-devices (NetworkManager does not merge that key across files).
# install.sh merges existing entries (e.g. interface-name:lerd0) with ap0
# instead of installing this file verbatim.
unmanaged-devices=interface-name:ap0
